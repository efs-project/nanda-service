name: EFS Scribe deep health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: efs-scribe-deep-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check production deep health
        env:
          HEALTH_URL: https://efs-scribe-production.up.railway.app/health/deep
          EXPECTED_MODE: sepolia
          HEALTH_TIMEOUT_MS: "15000"
        run: npm run health:check
